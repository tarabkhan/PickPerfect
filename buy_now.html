<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Now | PickPerfect</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top navbar-glass py-3"><div class="container">
<a class="navbar-brand brand-logo" href="/"><span class="brand-icon-box"><i class="bi bi-stars"></i></span>PickPerfect</a>
<a href="/cart" class="btn btn-outline-dark"><i class="bi bi-cart3 me-1"></i> Cart {% if cart_count %}<span class="badge bg-dark text-white ms-1">{{ cart_count }}</span>{% endif %}</a>
</div></nav>
<div class="container" style="padding-top:130px;padding-bottom:70px;max-width:900px;">
<span class="section-tag">Checkout</span><h1 class="section-title mb-4">Buy Now</h1>
<div class="row g-4">
<div class="col-lg-7"><div class="mono-card">
<h4 class="fw-bold">{{ product }}</h4><p class="text-muted mb-1">Product ID: {{ stockcode }}</p>
<div class="d-flex justify-content-between mt-4"><span>Unit price</span><strong>₹{{ '{:,.2f}'.format(price) }}</strong></div>
<div class="d-flex justify-content-between mt-2"><span>Quantity</span><span>{{ quantity }}</span></div>
<div class="border-top mt-3 pt-3 d-flex justify-content-between fs-5"><strong>Total</strong><strong>₹{{ '{:,.2f}'.format(subtotal) }}</strong></div>
</div></div>
<div class="col-lg-5"><div class="mono-card">
<h5 class="fw-bold">Order Details</h5>
<form method="POST" action="/order/place">
<input type="hidden" name="product" value="{{ product }}"><input type="hidden" name="quantity" value="{{ quantity }}">
<label class="form-label mt-3">Full Name</label><input class="form-control" name="name" required>
<label class="form-label mt-3">Delivery Address</label><textarea class="form-control" name="address" rows="3" required></textarea>
<label class="form-label mt-3">Payment Method</label><select class="form-select" name="payment"><option>Cash on Delivery</option><option>Demo Card Payment</option></select>
<button class="btn btn-dark w-100 mt-4" type="submit"><i class="bi bi-lock-fill me-1"></i> Place Demo Order</button>
</form><div class="small text-muted mt-3">Demo only — no real payment or order is processed.</div>
</div></div>
</div></div>
</body></html>
